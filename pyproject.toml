[project]
name = "it-incident-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "harleenkaur13", email = "sainiharleenkaur123@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "faiss-cpu>=1.16.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.4",
    "langchain-groq>=1.2.1",
    "langchain-huggingface>=1.3.0",
    "langchain-text-splitters>=1.2.0",
    "langgraph>=1.2.24",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "streamlit>=1.67.0",
]

[project.scripts]
it-incident-agent = "it_incident_agent:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
